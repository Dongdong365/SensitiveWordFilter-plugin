plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.0.0'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
}

shadowJar {
    archiveBaseName = 'SensitiveWordFilter'
    archiveClassifier = ''
    archiveVersion = SWFVERSION
}

build {
    dependsOn shadowJar
}

compileJava {
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}
